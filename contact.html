<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Gerrylyn Faustino - Doggy Art Gallery</title>

    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <nav class="navbar md:navbar-expand bg-1 fg-2">
        <div class="container-fluid">

            <a class="navbar-brand" href="index.html">Doggy Art Gallery</a>

            <button
                class="btn-icon navbar-toggler"
                type="button"
                data-bs-toggle="drawer"
                data-bs-target="#navbarNav"
                aria-controls="navbarNav"
                aria-expanded="false"
                aria-label="Toggle navigation">

                <span class="navbar-toggler-icon" aria-hidden="true"></span>
            </button>

            <dialog
                class="drawer drawer-end"
                id="navbarNav"
                aria-labelledby="navbarNavLabel">

                <div class="drawer-header">
                    <h5 class="drawer-title" id="navbarNavLabel">Menu</h5>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="drawer"
                        aria-label="Close">
                    </button>
                </div>

                <div class="drawer-body">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link" href="index.html">Home</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="index.html#gallery">Gallery</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="contact.html">Contact</a>
                        </li>
                    </ul>
                </div>

            </dialog>
        </div>
    </nav>

    <main class="container my-5">

        <h1>Contact Me</h1>
        <p>Have a question about my art? Feel free to reach out! I'd love to hear from you.</p>

        <form action="#" method="get">

            <div class="row g-4">

                <div class="col-12 md:col-6">
                    <label for="firstName">First Name</label>

                    <input
                        type="text"
                        class="form-control"
                        id="firstName"
                        name="firstName"
                        placeholder="Enter your first name"
                        required>
                </div>

                <div class="col-12 md:col-6">
                    <label for="lastName">Last Name</label>

                    <input
                        type="text"
                        class="form-control"
                        id="lastName"
                        name="lastName"
                        placeholder="Enter your last name"
                        required>
                </div>

                <div class="col-12 md:col-6">
                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        class="form-control"
                        id="email"
                        name="email"
                        placeholder="example@email.com"
                        required>
                </div>

                <div class="col-12 md:col-6">
                    <label for="inquiryType">Type of Inquiry</label>

                    <select
                        class="form-control"
                        id="inquiryType"
                        name="inquiryType"
                        required>

                        <option value="">Choose an option</option>
                        <option value="artwork">Artwork Questions</option>
                        <option value="commission">Commission Requests</option>
                        <option value="general">General Inquiry</option>

                    </select>
                </div>

                <div class="col-12">
                    <label for="message">Your Message</label>

                    <textarea
                        class="form-control"
                        id="message"
                        name="message"
                        rows="5"
                        placeholder="Write your message here..."
                        required></textarea>
                </div>

                <div class="col-12">
                    <div class="form-check">

                        <input
                            class="form-check-input"
                            type="checkbox"
                            id="consent"
                            name="consent"
                            required>

                        <label class="form-check-label" for="consent">I consent to being contacted regarding my inquiry.</label>

                    </div>
                </div>

                <div class="col-12">

                    <button
                        type="submit"
                        class="btn btn-solid theme-primary">

                        Send Message
                    </button>

                </div>
            </div>
        </form>
    </main>


    <footer class="container text-center py-4">
        <p>&copy; 2026 Gerrylyn Faustino. All rights reserved.</p>
    </footer>

    <script
        type="module"
        src="js/bootstrap.bundle.min.js">
    </script>

</body>
</html>
